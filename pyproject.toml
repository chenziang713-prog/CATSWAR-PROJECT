[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catswar-project"
version = "0.1.0"
description = "CATS WAR multi-account city war automation."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
]

[project.scripts]
catswar = "catswar_project.main:main"
catswar-gui = "catswar_project.gui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
